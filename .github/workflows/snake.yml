name: Generate Snake & Pacman Animations

on:
  schedule:
    - cron: "0 */12 * * *"    # runs every 12 hours
  workflow_dispatch:           # allows manual trigger
  push:
    branches:
      - main

jobs:
  generate-animations:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Generate Pac-Man Animation
        uses: timburrell/pacman-contribution-graph@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SLUG: ${{ github.repository_owner }}

      - name: Move Pac-Man output to dist
        run: |
          mkdir -p dist
          find . -maxdepth 1 -name "*.svg" -o -name "*.gif" | grep -i pac | xargs -I{} mv {} dist/ 2>/dev/null || true
          ls -la dist/

      - name: Push Animations to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
